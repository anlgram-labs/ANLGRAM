<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ANLGRAM | Bubblemaps v2 TON Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"/>
  <link rel="stylesheet" href="assets/css/gram-terminal-v2.css?v=2026.39"/>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <!-- Fixed Header -->
  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="logo-link">
        <img src="assets/img/anlgram-icon.svg" alt="Logo" width="28" height="28">
        <span class="logo-text">ANLGRAM</span>
      </a>
    </div>
    
    <div class="header-center">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search token or contract address on TON...">
      </div>
    </div>
    
    <div class="header-right">
      <div class="network-selector">
        <img src="assets/img/anlgram-icon.svg" width="16" height="16" alt="TON">
        <span>TON</span>
      </div>
      <button class="btn-connect">Connect Wallet</button>
    </div>
  </header>

  <div class="app-container">
    
    <!-- State A: Trending List (v2.bubblemaps.io/ton replica) -->
    <div id="view-list" class="view-list">
      <div class="list-container">
        <h1 class="list-title">Explore TON Ecosystem</h1>
        <p class="list-subtitle">Analyze top tokens and discover connections on the TON blockchain.</p>
        
        <div class="table-container">
          <div class="table-header">
            <div class="col-rank">#</div>
            <div class="col-token">Token</div>
            <div class="col-price">Price</div>
            <div class="col-24h">24h</div>
            <div class="col-mcap">Market Cap</div>
            <div class="col-vol">Volume (24h)</div>
            <div class="col-action"></div>
          </div>
          <div id="token-list-body" class="table-body">
            <!-- JS injects rows here -->
          </div>
        </div>
      </div>
    </div>

    <!-- State B: Fullscreen Map (v2.bubblemaps.io/map replica) -->
    <div id="view-map" class="view-map" style="display: none;">
      
      <!-- D3 Canvas Container -->
      <div id="bubble-map-container" class="bubble-map-canvas">
        <!-- Tooltip -->
        <div id="bubble-tooltip" class="bubble-tooltip" style="display: none;"></div>
      </div>
      
      <!-- UI Controls Overlay -->
      <div class="map-overlay">
        
        <!-- Top Left: Back Button -->
        <button id="btn-back" class="btn-glass back-button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Back to List
        </button>

        <!-- Left Panel: Token Context -->
        <div class="panel-left floating-panel">
          <div class="panel-token-header">
            <img id="map-logo" src="" alt="Logo" class="panel-logo">
            <div class="panel-token-titles">
              <div id="map-name" class="panel-name">Token Name</div>
              <div id="map-ticker" class="panel-ticker">TICKER</div>
            </div>
          </div>
          
          <div class="panel-stats">
            <div class="stat-row">
              <span>Price</span>
              <span id="map-price" class="data-font">$0.00</span>
            </div>
            <div class="stat-row">
              <span>Market Cap</span>
              <span id="map-mcap" class="data-font">$0.00</span>
            </div>
            <div class="stat-row">
              <span>Holders</span>
              <span id="map-holders" class="data-font">0</span>
            </div>
          </div>

          <div class="panel-legend">
            <div class="legend-title">Legend</div>
            <div class="legend-item"><span class="color-dot" style="background:#d500f9;"></span> Top Holders</div>
            <div class="legend-item"><span class="color-dot" style="background:#651fff;"></span> CEX</div>
            <div class="legend-item"><span class="color-dot" style="background:#00e5ff;"></span> Liquidity Pools</div>
            <div class="legend-item"><span class="color-dot" style="background:#ff9100;"></span> Insiders</div>
            <div class="legend-item"><span class="color-dot" style="background:#b388ff;"></span> Retail</div>
          </div>
        </div>

        <!-- Right Panel: Wallet Details (Hidden initially) -->
        <div id="panel-wallet" class="panel-right floating-panel" style="display: none;">
          <div class="wallet-type" id="wallet-badge">Wallet</div>
          <div class="wallet-address data-font" id="wallet-address">EQ...</div>
          
          <div class="panel-stats mt-3">
            <div class="stat-row">
              <span>Balance</span>
              <span id="wallet-balance" class="data-font">0</span>
            </div>
            <div class="stat-row">
              <span>% of Supply</span>
              <span id="wallet-supply" class="data-font text-electric">0.00%</span>
            </div>
          </div>

          <div class="wallet-actions">
            <button class="btn-primary w-full">Copy Address</button>
            <button class="btn-secondary w-full mt-2">View on Explorer</button>
          </div>
        </div>

        <!-- Bottom Center: Zoom Controls -->
        <div class="zoom-controls floating-panel">
          <button id="zoom-in" title="Zoom In">+</button>
          <div class="divider-vertical"></div>
          <button id="zoom-out" title="Zoom Out">-</button>
          <div class="divider-vertical"></div>
          <button id="zoom-reset" title="Reset View">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>

      </div>
    </div>

  </div>

  <script src="assets/js/gram-terminal-v2.js?v=2026.39"></script>
</body>
</html>
