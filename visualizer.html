<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bubblemaps | GRAM Network Intelligence</title>
  <meta name="description" content="Explore wallets, reveal connections, and see through the noise of blockchain data with interactive bubble maps."/>
  
  <!-- Add favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"/>
  <link rel="shortcut icon" href="favicon.ico?v=2"/>
  
  <!-- Subagent Styles -->
  <link rel="stylesheet" href="assets/css/bubblemaps.css?v=2026.36"/>
  
  <!-- D3 library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" style="display:flex; align-items:center; gap:8px;">
        <img src="assets/img/anlgram-icon.svg" alt="Logo" width="24" height="24">
        <span class="logo">ANLGRAM Bubblemaps</span>
      </a>
    </div>
    
    <div class="topbar-center">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" placeholder="Search token or contract address...">
      </div>
    </div>
    
    <div class="topbar-right">
      <div class="chain-selector">
        <img src="assets/img/anlgram-icon.svg" width="16" height="16" alt="GRAM">
        <span>GRAM</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.8rem;">Connect</button>
    </div>
  </header>

  <!-- App Container -->
  <div class="app-container">
    
    <!-- HOMEPAGE (Trending List) -->
    <div id="homepage" class="trending-container" style="display: block;">
      <div class="trending-header">
        🔥 Trending on GRAM Network
      </div>
      <ul id="trending-list" class="trending-list">
        <!-- JS will populate trending tokens here -->
      </ul>
    </div>

    <!-- MAP VIEW -->
    <div id="mapview" style="display: none; width: 100%; height: 100%;">
      
      <!-- Force-directed graph canvas container -->
      <div id="map-container" class="map-canvas-container">
        <!-- SVG injected by D3 -->
      </div>
      
      <!-- Back button (Absolute top left) -->
      <button id="back-btn" class="btn" style="position:absolute; top:20px; left:20px; z-index:20;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Back to Trending
      </button>

      <!-- Left Panel: Token Info -->
      <div class="panel panel-left" style="top:70px;">
        <div class="token-header">
          <div id="map-token-logo" class="token-logo" style="display:flex; align-items:center; justify-content:center; font-size:18px;">💎</div>
          <div>
            <div id="map-token-name" class="token-title">GRAM</div>
            <div class="token-ticker" id="map-token-ticker">GRAM</div>
          </div>
        </div>
        
        <div class="info-row">
          <span class="info-label">Price</span>
          <span id="map-token-price" class="info-value data-text">$0.00</span>
        </div>
        
        <div class="info-row">
          <span class="info-label">Max Supply</span>
          <span id="map-token-supply" class="info-value data-text">0</span>
        </div>
        
        <div class="info-row">
          <span class="info-label">Holders</span>
          <span id="map-token-holders" class="info-value data-text">0</span>
        </div>
        
        <div class="info-row">
          <span class="info-label">Decentralization</span>
          <span class="info-value data-text" style="color: #4caf50;">78/100</span>
        </div>
        
        <div class="color-legend">
          <div class="legend-title">Legend</div>
          <div class="legend-item">
            <div class="legend-color" style="background:#E91E63;"></div>
            <span>Whale / Top Holders</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#3F51B5;"></div>
            <span>Exchanges (CEX)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#00BCD4;"></div>
            <span>Liquidity Pools</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#FFC107;"></div>
            <span>Team / Insiders</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:#9E9E9E;"></div>
            <span>Retail / Other</span>
          </div>
        </div>
      </div>
      
      <!-- Right Panel: Wallet Info (Hidden by default) -->
      <div id="wallet-panel" class="panel panel-right">
        <div class="wallet-header">
          <span class="info-label">Wallet Address</span>
          <span id="w-address" class="wallet-address">Select a bubble</span>
          <span id="w-type" class="wallet-type-badge">Unknown</span>
        </div>
        
        <div class="info-row">
          <span class="info-label">Balance</span>
          <span id="w-balance" class="info-value data-text">0</span>
        </div>
        
        <div class="info-row">
          <span class="info-label">% of Supply</span>
          <span id="w-percentage" class="info-value data-text">0.00%</span>
        </div>
        
        <div class="action-buttons">
          <button class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copy
          </button>
          <button class="btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            Explorer
          </button>
        </div>
      </div>
      
      <!-- Zoom Controls -->
      <div class="controls-panel">
        <button id="zoom-in" class="control-btn" title="Zoom In">+</button>
        <div style="width:1px; background:rgba(255,255,255,0.1); margin: 4px 2px;"></div>
        <button id="zoom-out" class="control-btn" title="Zoom Out">-</button>
        <div style="width:1px; background:rgba(255,255,255,0.1); margin: 4px 2px;"></div>
        <button id="zoom-reset" class="control-btn" title="Reset View">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
      
    </div>
  </div>

  <!-- Subagent JS Engine -->
  <script src="assets/js/bubblemaps.js?v=2026.36"></script>
</body>
</html>
