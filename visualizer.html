<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ANLGRAM Intelligence Terminal | Premium Institutional Analytics</title>
  <meta name="description" content="Institutional-grade analytics platform for the GRAM ecosystem. Bloomberg Terminal, Arkham Intelligence, and TradingView merged into one seamless experience."/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"/>
  <link rel="shortcut icon" href="favicon.ico?v=2"/>
  <link rel="apple-touch-icon" href="favicon.svg?v=2"/>
  
  <link rel="stylesheet" href="assets/css/gram-terminal-v2.css?v=2026.37"/>
  
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  
  <!-- CSS Animated Background Element -->
  <div class="v3-bg"></div>

  <!-- Header -->
  <header class="v3-header">
    <div class="header-left">
      <a href="index.html" style="display:flex; align-items:center; gap:12px;">
        <img src="assets/img/anlgram-icon.svg" alt="ANLGRAM" width="28" height="28">
        <span class="logo-text">ANLGRAM Terminal</span>
      </a>
      <div class="network-badge">
        <span class="dot-live"></span> GRM Mainnet
      </div>
    </div>
    
    <div class="header-center">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search token, address, or Tx hash...">
        <div class="keyboard-shortcut">/</div>
      </div>
    </div>
    
    <div class="header-right">
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="btn-connect">Connect Wallet</button>
    </div>
  </header>

  <div class="v3-container">
    
    <!-- State A: Grid View -->
    <div id="view-grid" class="animate-fade-in">
      <div class="grid-header">
        <h1 class="page-title">Top 30 GRM Network Tokens</h1>
        <div class="view-controls">
          <button class="filter-btn active">Overview</button>
          <button class="filter-btn">Performance</button>
          <button class="filter-btn">Smart Money</button>
        </div>
      </div>
      
      <div id="token-grid" class="token-grid">
        <!-- JS injects .token-card here -->
      </div>
    </div>

    <!-- State B: Token Detail View -->
    <div id="view-detail" style="display: none;" class="animate-fade-in">
      
      <div class="detail-header-actions">
        <button id="back-button" class="btn-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Back to Terminal
        </button>
      </div>

      <div class="detail-view">
        
        <!-- Left Panel: Info -->
        <div class="detail-panel panel-left">
          <div class="detail-hero">
            <h2 id="detail-symbol" class="detail-title">TOKEN</h2>
            <div id="detail-price" class="detail-price data-font">$0.00</div>
            <div id="detail-change" class="detail-change data-font">+0.00%</div>
          </div>
          
          <div class="detail-stats-list">
            <div class="stat-row">
              <span class="stat-lbl">Market Cap</span>
              <span id="detail-mcap" class="stat-val data-font">-</span>
            </div>
            <div class="stat-row">
              <span class="stat-lbl">Liquidity</span>
              <span id="detail-liq" class="stat-val data-font">-</span>
            </div>
            <div class="stat-row">
              <span class="stat-lbl">Volume (24H)</span>
              <span id="detail-vol" class="stat-val data-font">-</span>
            </div>
            <div class="stat-row">
              <span class="stat-lbl">Holders</span>
              <span id="detail-holders" class="stat-val data-font">-</span>
            </div>
            <div class="stat-row">
              <span class="stat-lbl">Risk Score</span>
              <span id="detail-risk" class="stat-val data-font">-</span>
            </div>
          </div>
        </div>

        <!-- Center Panel: Chart -->
        <div class="detail-panel panel-center">
          <div class="chart-toolbar">
            <div class="toolbar-tabs">
              <button class="toolbar-btn">1H</button>
              <button class="toolbar-btn active">4H</button>
              <button class="toolbar-btn">1D</button>
              <button class="toolbar-btn">1W</button>
            </div>
            <div class="toolbar-tabs">
              <button class="toolbar-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                Indicators
              </button>
            </div>
          </div>
          <div id="main-chart-container" class="main-chart"></div>
        </div>

        <!-- Right Panel: Activity -->
        <div class="detail-panel panel-right">
          <div class="right-tabs">
            <button class="right-tab active">Recent Trades</button>
            <button class="right-tab">Whales</button>
          </div>
          <div class="trades-header">
            <span>Time</span>
            <span>Price</span>
            <span>Amount</span>
          </div>
          <div id="recent-trades-list" class="recent-trades-list">
            <!-- JS injects trades -->
          </div>
        </div>

      </div>
    </div>
    
  </div>

  <script src="assets/js/gram-terminal-v2.js?v=2026.37"></script>
</body>
</html>
