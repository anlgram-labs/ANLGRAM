name = "anlgram-testnet-preparation"
main = "worker.mjs"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# RESERVED CONFIGURATION, NOT A CLAIM THAT DNS OR THIS ORIGIN EXISTS.
# Confirm zone ownership and absence of an existing service before first deploy.
routes = [{ pattern = "testnet.anlgram.com", custom_domain = true }]

[vars]
APP_ORIGIN = "https://testnet.anlgram.com"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "PROOFS"
class_name = "ProofAttempt"

[[durable_objects.bindings]]
name = "OPERATIONS"
class_name = "FinancialOperation"

[[durable_objects.bindings]]
name = "TESTNET_READS"
class_name = "TestnetReads"

[[durable_objects.bindings]]
name = "CURVE_OPERATIONS"
class_name = "CurveFinancialOperation"

[[durable_objects.bindings]]
name = "PROJECT_REGISTRY"
class_name = "ProjectRegistry"
script_name = "anlgram-testnet-project-registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProofAttempt"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FinancialOperation"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["TestnetReads"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["CurveFinancialOperation"]
